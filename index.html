<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniMap — Explore the Universe</title>
    <meta
      name="description"
      content="UniMap is a lightweight catalogue of stars, planets, nebulae, black holes, neutron stars and galaxies."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1>UniMap</h1>
        <p class="tagline">A small map of very large things.</p>
      </div>
    </header>

    <main class="wrap" id="main">
      <!-- Search + filters -->
      <section class="panel" id="browse-view" aria-labelledby="browse-heading">
        <h2 id="browse-heading" class="visually-hidden">Browse celestial bodies</h2>

        <form class="search" id="search-form" role="search">
          <div class="search-field">
            <label for="search-input">Search by name</label>
            <input
              type="search"
              id="search-input"
              name="q"
              placeholder="e.g. Betelgeuse"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="search-actions">
            <button type="submit" class="btn btn-primary">Search</button>
            <button type="button" class="btn" id="clear-button">Clear search</button>
          </div>
        </form>

        <fieldset class="filters">
          <legend>Filter by category</legend>
          <div class="filter-buttons" id="filter-buttons">
            <button type="button" class="chip is-active" data-category="All" aria-pressed="true">All</button>
            <button type="button" class="chip" data-category="Stars" aria-pressed="false">Stars</button>
            <button type="button" class="chip" data-category="Planets" aria-pressed="false">Planets</button>
            <button type="button" class="chip" data-category="Exoplanets" aria-pressed="false">Exoplanets</button>
            <button type="button" class="chip" data-category="Dwarf Planets" aria-pressed="false">Dwarf Planets</button>
            <button type="button" class="chip" data-category="Moons" aria-pressed="false">Moons</button>
            <button type="button" class="chip" data-category="Nebulae" aria-pressed="false">Nebulae</button>
            <button type="button" class="chip" data-category="Black Holes" aria-pressed="false">Black Holes</button>
            <button type="button" class="chip" data-category="Neutron Stars" aria-pressed="false">Neutron Stars</button>
            <button type="button" class="chip" data-category="Galaxies" aria-pressed="false">Galaxies</button>
            <button type="button" class="chip" data-category="Star Clusters" aria-pressed="false">Star Clusters</button>
          </div>
        </fieldset>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <h3 class="results-heading">Results</h3>
        <ul class="results" id="results"></ul>
      </section>

      <!-- Detail view -->
      <section class="panel" id="detail-view" aria-labelledby="detail-name" hidden>
        <button type="button" class="btn" id="back-button">&larr; Back to results</button>
        <article class="detail">
          <h2 id="detail-name"></h2>
          <dl class="detail-list">
            <div class="detail-row">
              <dt>Type</dt>
              <dd id="detail-type-value"></dd>
            </div>
            <div class="detail-row" id="detail-row-distance">
              <dt>Distance</dt>
              <dd id="detail-distance"></dd>
            </div>
            <div class="detail-row" id="detail-row-size">
              <dt>Size</dt>
              <dd id="detail-size"></dd>
            </div>
            <div class="detail-row" id="detail-row-circumference">
              <dt>Circumference</dt>
              <dd id="detail-circumference"></dd>
            </div>
            <div class="detail-row" id="detail-row-measurement">
              <dt id="detail-measurement-label"></dt>
              <dd id="detail-measurement-value"></dd>
            </div>
            <div class="detail-row" id="detail-row-source">
              <dt>Source</dt>
              <dd id="detail-source"></dd>
            </div>
          </dl>
        </article>
      </section>

      <p class="error" id="error" role="alert" hidden></p>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>UniMap — static HTML, CSS, and vanilla JavaScript.</p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
